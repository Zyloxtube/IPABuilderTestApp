# Manual dispatch is enabled; pushes to main also build the unsigned IPA.
name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply Leriz client fixes
        run: python3 patch_leriz.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project Leriz.xcodeproj \
            -scheme Leriz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Leriz.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r Leriz-unsigned.ipa Payload
          test -s Leriz-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leriz-unsigned-IPA
          path: Leriz-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct IPA download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leriz-build-${{ github.run_number }}
          name: Leriz iOS build ${{ github.run_number }}
          files: Leriz-unsigned.ipa
          generate_release_notes: false
