name: IPABuilderTestApp
options:
  bundleIdPrefix: com.zyloxtube
  deploymentTarget:
    iOS: "16.0"
targets:
  IPABuilderTestApp:
    type: application
    platform: iOS
    sources:
      - IPABuilderTestApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyloxtube.ipabuildertestapp
        PRODUCT_NAME: IPABuilderTestApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Loop
        INFOPLIST_KEY_NSCameraUsageDescription: Loop uses the front camera for face effects and video recording.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Loop records microphone audio with your videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Loop can save recorded videos to your Photos library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
