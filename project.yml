name: Leriz
options:
  bundleIdPrefix: com.zyloxtube
  deploymentTarget:
    iOS: "16.0"
targets:
  Leriz:
    type: application
    platform: iOS
    sources:
      - IPABuilderTestApp.swift
      - path: server.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyloxtube.leriz
        PRODUCT_NAME: Leriz
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Leriz
        INFOPLIST_KEY_NSCameraUsageDescription: Leriz uses the front camera for face effects and video recording.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Leriz records microphone audio with your videos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Leriz can save recorded videos to your Photos library.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
