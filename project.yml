name: IPABuilderTestApp
options:
  bundleIdPrefix: com.zyloxtube
  deploymentTarget:
    iOS: "16.0"
targets:
  IPABuilderTestApp:
    type: application
    platform: iOS
    sources:
      - main.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyloxtube.ipabuildertestapp
        PRODUCT_NAME: IPABuilderTestApp
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IPA Builder Test
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
